networks:
  internal:
    driver: bridge
  traefik_public:
    external: true

volumes:
  resusbot_data:
  redis_data:
  openwa_session:

services:

  # ── Redis ───────────────────────────────────────────────────────────────────
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: redis-server --appendonly yes --appendfsync everysec --loglevel warning
    volumes:
      - redis_data:/data
    networks:
      - internal
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 3

  # ── SearXNG ─────────────────────────────────────────────────────────────────
  searxng:
    image: searxng/searxng:latest
    restart: unless-stopped
    volumes:
      - ./searxng:/etc/searxng:rw
    networks:
      - internal
    environment:
      - SEARXNG_BASE_URL=http://searxng:8080/

  # ── OrioSearch ──────────────────────────────────────────────────────────────
  oriosearch:
    image: oriosearch/oriosearch:1
    restart: unless-stopped
    environment:
      - SEARXNG_URL=http://searxng:8080
      - REDIS_URL=redis://redis:6379
    depends_on:
      redis:
        condition: service_healthy
      searxng:
        condition: service_started
    networks:
      - internal

  # ── open-wa (WhatsApp sidecar) ───────────────────────────────────────────────
  # First run: docker compose logs openwa --follow  →  scan the QR code with your phone
  # Subsequent runs: session is restored from the openwa_session volume automatically
  openwa:
    image: openwa/wa-automate:latest
    restart: unless-stopped
    environment:
      - PORT=3000
      # Webhook URL inside the Docker network — open-wa POSTs events here
      - WA_WEB_HOOK=http://bot:8000/whatsapp/webhook
      # Include in every webhook POST so FastAPI can validate origin
      - WA_WEBHOOK_HEADERS=x-wa-webhook-secret:${WA_WEBHOOK_SECRET:-changeme-wa}
      # Optional API key for the open-wa REST API
      - WA_API_KEY=${OPENWA_API_KEY:-}
      # Persist QR auth session between restarts
      - WA_SESSION_DATA_PATH=/session
      # Suppress QR in stdout; write to file instead (readable via `docker cp`)
      - DISABLE_SPINS=true
    volumes:
      - openwa_session:/session
    networks:
      - internal
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3000/getStatus"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s

  # ── ResusBot ─────────────────────────────────────────────────────────────────
  bot:
    build: .
    restart: unless-stopped
    env_file: .env
    volumes:
      - resusbot_data:/data
    depends_on:
      redis:
        condition: service_healthy
      oriosearch:
        condition: service_started
      openwa:
        condition: service_started
    networks:
      - internal
      - traefik_public
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.resusbot.rule=Host(`${DOMAIN:-resusbot.local}`)"
      - "traefik.http.routers.resusbot.entrypoints=websecure"
      - "traefik.http.routers.resusbot.tls.certresolver=letsencrypt"
      - "traefik.http.routers.resusbot-http.rule=Host(`${DOMAIN:-resusbot.local}`)"
      - "traefik.http.routers.resusbot-http.entrypoints=web"
      - "traefik.http.routers.resusbot-http.middlewares=redirect-https"
      - "traefik.http.middlewares.redirect-https.redirectscheme.scheme=https"
      - "traefik.http.services.resusbot.loadbalancer.server.port=8000"
