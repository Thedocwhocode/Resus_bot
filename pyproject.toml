[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "resusbot"
version = "0.1.0"
description = "Bot Telegram para pesquisa de artigos científicos médicos (ressuscitação/emergências)"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "python-telegram-bot>=21.6",
    "agno>=1.0.0",
    "groq>=0.11.0",
    "httpx[http2]>=0.27.0",
    "pydantic-settings>=2.5.0",
    "sqlalchemy[asyncio]>=2.0.0",
    "aiosqlite>=0.20.0",
    "alembic>=1.13.0",
    "redis[asyncio]>=5.1.0",
    "slowapi>=0.1.9",
    "jinja2>=3.1.0",
    "passlib[bcrypt]>=1.7.4",
    "itsdangerous>=2.2.0",
    "structlog>=24.4.0",
    "python-multipart>=0.0.9",
    "mercadopago>=2.2.3",
    "apscheduler>=3.10.4",
    "tzdata>=2024.1",
]

[project.optional-dependencies]
rag = [
    "docling>=2.0.0",
    "llama-index-core>=0.12.0",
    "llama-index-embeddings-huggingface>=0.4.0",
    "llama-index-vector-stores-chroma>=0.4.0",
    "chromadb>=0.6.0",
    "sentence-transformers>=3.0.0",
]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.24.0",
    "pytest-cov>=5.0.0",
    "fakeredis>=2.25.0",
    "httpx>=0.27.0",
    "ruff>=0.7.0",
    "mypy>=1.13.0",
    "types-passlib>=1.7.7",
]

[tool.hatch.build.targets.wheel]
packages = ["src/resusbot"]

[tool.ruff]
target-version = "py312"
line-length = 100
src = ["src"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "TCH"]
ignore = ["E501", "B008"]

[tool.mypy]
python_version = "3.12"
strict = false
ignore_missing_imports = true
exclude = [
    "tests/",
    "src/resusbot/db/migrations/",
    "src/resusbot/dashboard/routes.py",
    "src/resusbot/workflows/research_workflow.py",
    "src/resusbot/study/",
    "src/resusbot/rag/",
]
warn_unused_ignores = false

[[tool.mypy.overrides]]
module = ["resusbot.cache.redis_client", "resusbot.services.research_service"]
ignore_errors = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "--cov=src/resusbot --cov-report=term-missing --cov-fail-under=30"

[tool.coverage.run]
omit = ["src/resusbot/db/migrations/*", "tests/*"]
