# Override para desenvolvimento local (sem Traefik, polling, porta exposta)
# Uso: docker compose -f docker-compose.yml -f docker-compose.dev.yml up
services:
  redis:
    ports:
      - "6379:6379"

  openwa:
    ports:
      - "3000:3000"
    environment:
      # In dev, webhook points to host machine (FastAPI running locally)
      - WA_WEB_HOOK=http://host.docker.internal:8000/whatsapp/webhook
      - WA_SESSION_DATA_PATH=/session

  bot:
    build: .
    ports:
      - "8000:8000"
    volumes:
      - ./data:/data
      # Hot-reload: bind do código sobre o pacote instalado em site-packages
      - ./src/resusbot:/opt/venv/lib/python3.12/site-packages/resusbot
    environment:
      - TELEGRAM_MODE=polling
      - APP_ENV=development
      - LOG_LEVEL=DEBUG
      - SQLITE_PATH=/data/resusbot.db
      - REDIS_URL=redis://redis:6379/0
    command: uvicorn resusbot.main:app --host 0.0.0.0 --port 8000 --reload
    networks: !reset
      - internal

networks:
  traefik_public: !reset null
